location = /coslaconf { return 301 /coslaconf/; }
location = /coslaconf/slideshow { return 301 /coslaconf/slideshow/; }
location ^~ /coslaconf/ {
    location ~ /\. { return 404; }
    alias /var/www/cosla-conference-live/;
    index index.html;
    access_log off;
    add_header Cache-Control "no-cache";
}
location ^~ /coslaconf-api/ { return 404; }
location = /coslaconf-api/complete {
    limit_req zone=cosla_conference_submit burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    access_log off;
    proxy_pass http://127.0.0.1:8775/complete;
}
location = /coslaconf-api/display-results {
    access_log off;
    proxy_pass http://127.0.0.1:8775/display-results;
}

location = /coslaconf-preview { return 301 /coslaconf-preview/; }
location = /coslaconf-preview/slideshow { return 301 /coslaconf-preview/slideshow/; }
location ^~ /coslaconf-preview/ {
    location ~ /\. { return 404; }
    alias /var/www/cosla-conference-test/;
    index index.html;
    access_log off;
    add_header Cache-Control "no-cache";
}
location ^~ /coslaconf-test-api/ { return 404; }
location = /coslaconf-test-api/complete {
    limit_req zone=cosla_conference_submit burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    access_log off;
    proxy_pass http://127.0.0.1:8776/complete;
}
location = /coslaconf-test-api/display-results {
    access_log off;
    proxy_pass http://127.0.0.1:8776/display-results;
}
